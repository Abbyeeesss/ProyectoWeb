# Ejemplo Render Blueprint — defina DATABASE_URL (secreto) en el dashboard con la URI de Supabase.

services:
  - type: web
    name: abastecimiento-admin-api
    rootDir: backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # - key: DATABASE_URL
      #   sync: false   # valor desde Dashboard → Environment (Supabase URI)
